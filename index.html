<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KRC GROUP | Login</title>

    <link
        rel="stylesheet"
        href="src/style.css"
    >

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <!-- KRC LOGO -->
            <div class="login-logo">

                <img
                    src="assets/krc-logo.jpeg"
                    alt="KRC GROUP Logo"
                >

            </div>

            <!-- LOGIN HEADER -->
            <div class="login-header">

                <h1>KRC GROUP</h1>

                <p>Master Portal</p>

            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Sign In
                </button>


                <div
                    id="message"
                    class="login-message"
                ></div>

            </form>


            <!-- FOOTER -->
            <div class="login-footer">

                <p>
                    © 2026 KRC GROUP. All Rights Reserved.
                </p>

            </div>

        </div>

    </div>


    <script src="src/script.js"></script>

</body>

</html>
